name: Publish release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Package integration files
        working-directory: custom_components/jackery
        run: zip -r "$GITHUB_WORKSPACE/jackery.zip" . -x '*/__pycache__/*' '*.pyc'

      - name: Upload ZIP to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE/jackery.zip" --clobber
